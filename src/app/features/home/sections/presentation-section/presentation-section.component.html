<section class="presentation" aria-labelledby="presentation-title">
  <aside class="profile-card" aria-label="Profile card">
    <img
      class="profile-card__photo"
      [src]="photoUrl"
      [alt]="name + ' profile picture'"
    />

    <div class="profile-card__identity">
      <h2>{{ name }}</h2>
      <p class="profile-card__role">{{ role }}</p>
      <a class="profile-card__email" [href]="contactUrl">{{ email }}</a>
    </div>

    <div class="profile-card__links">
      <a [href]="linkedinUrl" target="_blank" rel="noopener">LinkedIn</a>
      <a [href]="githubUrl" target="_blank" rel="noopener">GitHub</a>
    </div>

    <div class="profile-card__actions">
      <a class="profile-card__button profile-card__button--secondary" routerLink="/resume">
        View my CV
      </a>
      <a class="profile-card__button profile-card__button--primary" [href]="contactUrl">
        Contact me
      </a>
    </div>
  </aside>

  <div class="presentation__content">
    <p class="presentation__intro">Hello, I am</p>
    <h1 id="presentation-title">{{ name }}</h1>
    <p class="presentation__role">{{ role }}</p>
    <p id="bio-1" class="presentation__bio">{{ shortBio1 }}</p>
    <p id="bio-2" class="presentation__bio">{{ shortBio2 }}</p>
    <p id="bio-3" class="presentation__bio">{{ shortBio3 }}</p>
    <p id="bio-4" class="presentation__bio">{{ shortBio4 }}</p>

  </div>
</section>
