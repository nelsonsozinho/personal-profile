name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build da aplicacao
        run: npm run build:prod

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Definir imagem Docker
        id: image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is empty"
            exit 1
          fi

          DOCKER_NAMESPACE="$(printf '%s' "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')"

          if ! printf '%s' "$DOCKER_NAMESPACE" | grep -Eq '^[a-z0-9]+([._-][a-z0-9]+)*$'; then
            echo "Invalid Docker namespace: $DOCKER_NAMESPACE"
            exit 1
          fi

          IMAGE_REF="$DOCKER_NAMESPACE/personal-profile:latest"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        run: docker build -t ${{ steps.image.outputs.image_ref }} .

      - name: Push da imagem
        run: docker push ${{ steps.image.outputs.image_ref }}

      - name: Deploy no VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_REF
          script: |
            docker pull "$IMAGE_REF"
            docker stop personal-profile || true
            docker rm personal-profile || true
            docker run -d -p 80:4000 -e NODE_ENV=production -e PORT=4000 --name personal-profile "$IMAGE_REF"
