name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build da aplicacao
        run: npm run build:prod

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da imagem Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/personal-profile:latest .

      - name: Push da imagem
        run: docker push ${{ secrets.DOCKER_USERNAME }}/personal-profile:latest

      - name: Deploy no VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/personal-profile:latest
            docker stop personal-profile || true
            docker rm personal-profile || true
            docker run -d -p 80:4000 -e NODE_ENV=production -e PORT=4000 --name personal-profile ${{ secrets.DOCKER_USERNAME }}/personal-profile:latest
